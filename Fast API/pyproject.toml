[project]
name = "fast-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.142.2",
    "greenlet>=3.5.6",
    "pgvector>=0.3.6",
    "sqlalchemy>=2.0.36",
]
[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
